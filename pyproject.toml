[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroai"
version = "0.1.0"
description = "Machine learning for streamflow on CAMELS: baselines, random forest, MLP and LSTM"
authors = [{ name = "Ichrak Boubakri", email = "ichrak.enstab@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib", "scikit-learn", "torch>=2.0", "xarray", "netCDF4"]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
